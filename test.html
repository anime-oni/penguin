<!DOCTYPE html>
<html>
  <head>
    <title> Pi-Hole Simple Dash </title>
    <link rel="icon" href="https://wp-cdn.pi-hole.net/wp-content/uploads/2016/12/cropped-Vortex-R-180x180.png" sizes="16x16" type="image/png">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

      body {
        font-size: 20px;
        background-color: #36393e;
        font-family: "Inter", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        color: #E1E1E1;
      }

      h1 {
        font-size: 1.5em font-family: "Poppins", sans-serif;
        font-weight: 700;
        font-style: normal;
        color: #E1E1E1;
      }

      h2 {
        font-size: 1.2em font-family: "Poppins", sans-serif;
        font-weight: 700;
        font-style: normal;
        color: #E1E1E1;
      }

      h3 {
        font-size: 1.05em font-family: "Poppins", sans-serif;
        font-weight: 700;
        font-style: normal;
        color: #E1E1E1;
      }

      .center {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .b1 {
        background-color: #F02C0A;
        color: #E1E1E1;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border-radius: 8px;
        border: 2px solid black;
      }

      .b2 {
        background-color: #3CF00A;
        color: #E1E1E1;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border-radius: 8px;
        border: 2px solid black;
      }

       .box {
        background-color: #1e2124;
        border: 2px solid black;
        padding: 10px;
        width: 80%;
        max-width: 1900px;
        color: white;
        box-sizing: border-box;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        margin: 0 auto;
      }
      
      .flex-container {
        display: flex;
        flex-direction: row:
        justify-content: center;
        align-items: center;
      }

    </style>
  </head>
  <body>
    <div class="center">
      <h1>Pi-Hole Control Panel</h1>
    </div>
    <div class="center">
      <div class="box">
        <h2>Temporarily Disable</h2>
        <div class="flex-container">
          <button class="b1">Test</button>
          <button class="b1">Test</button>
          <button class="b1">Test</button>
          <button class="b1">Test</button>
          <button class="b1">Test</button>
        </div>
      </div>
    </div>
  </body>
</html>
